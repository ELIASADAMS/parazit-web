<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARAZIT / COLLECTION</title><link rel="stylesheet" href="styles.css"><style>.collection-page{padding:28px 0 70px}.collection-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}.collection-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.collection-grid figure{margin:0;border:1px solid var(--line,#111);background:var(--paper,#f4f1e8)}.collection-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.collection-grid figcaption{padding:8px;font-size:10px;line-height:1.3}.collection-error{padding:30px;border:1px solid var(--line,#111)}@media(max-width:900px){.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.collection-head{display:block}}</style></head>
<body><div class="site-shell"><header class="masthead"><a class="brand" href="index.html#home">PARAZIT</a><nav class="primary-nav"><a href="index.html#archive">ARCHIVE</a><a href="index.html#gallery">GALLERY</a><a href="index.html#index">INDEX</a><a href="materials.html">MATERIALS</a><a href="index.html#about">ABOUT</a></nav></header><div class="system-strip"><div class="ticker">PARAZIT IMAGE ARCHIVE • COLLECTION VIEWER •</div></div><main class="collection-page"><div class="collection-head"><div><span class="eyebrow">IMAGE COLLECTION</span><h1 id="title">LOADING…</h1><p id="meta"></p></div><a class="system-action" href="index.html#archive">← ARCHIVE</a></div><div id="grid" class="collection-grid"></div></main><footer class="footer"><span>PARAZIT / DIGITAL ARCHIVE</span><span>IMAGE COLLECTION</span><span><a href="materials.html">MATERIALS ↗</a></span></footer></div><script>
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);const folder=params.get('folder');
const raw=p=>'https://raw.githubusercontent.com/ELIASADAMS/parazit-web/main/'+p.split('/').map(encodeURIComponent).join('/');
async function init(){if(!folder){throw new Error('Missing collection folder')};const url='https://api.github.com/repos/ELIASADAMS/parazit-web/contents/'+folder.split('/').map(encodeURIComponent).join('/')+'?ref=main';const r=await fetch(url);if(!r.ok)throw new Error('Collection not found');const files=await r.json();const images=files.filter(x=>x.type==='file'&&/\.(jpe?g|png|gif|webp)$/i.test(x.name));document.title='PARAZIT / '+folder.split('/').pop();document.getElementById('title').textContent=folder.split('/').pop();document.getElementById('meta').textContent=images.length+' IMAGES / SOURCE DIRECTORY PRESERVED';document.getElementById('grid').innerHTML=images.map((x,i)=>`<figure><a href="${raw(x.path)}" target="_blank" rel="noopener"><img src="${raw(x.path)}" alt="${esc(x.name)}" loading="lazy"></a><figcaption>${String(i+1).padStart(3,'0')} / ${esc(x.name)}</figcaption></figure>`).join('')||'<div class="collection-error">NO IMAGE FILES IN COLLECTION</div>'}
init().catch(e=>{document.getElementById('title').textContent='COLLECTION ERROR';document.getElementById('grid').innerHTML='<div class="collection-error">'+esc(e.message)+'</div>'});
</script></body></html>
