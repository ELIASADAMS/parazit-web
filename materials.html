<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARAZIT / MATERIALS</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1400px;margin:auto;padding:40px 24px}.bar{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{border:1px solid currentColor;background:transparent;cursor:pointer;text-align:left;padding:0;color:inherit}.thumb{aspect-ratio:4/3;background:#eee;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.meta{padding:14px}.count{opacity:.65}.reader{position:fixed;inset:0;background:#fff;color:#111;z-index:20;overflow:auto;padding:24px}.reader-head{display:flex;justify-content:space-between;position:sticky;top:0;background:#fff;padding-bottom:16px;z-index:2}.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.collection-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}.close{font-size:28px;border:0;background:none;cursor:pointer}.status{opacity:.65}.text-list{display:grid;gap:1px;border-top:1px solid currentColor}.text-item{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid currentColor}.muted{opacity:.65}.empty{padding:24px 0;opacity:.65}.reader-text{max-width:900px;margin:30px auto;font-size:18px;line-height:1.65;white-space:pre-wrap}.reader-text h1,.reader-text h2,.reader-text h3{line-height:1.1}.reader-text a{color:inherit}.note{padding:14px;border:1px solid currentColor;margin:16px 0;opacity:.75}</style></head><body><header class="masthead"><a class="brand" href="index.html">PARAZIT</a><nav class="primary-nav"><a href="index.html#archive">ARCHIVE</a><a href="index.html#gallery">GALLERY</a><a href="index.html#index">INDEX</a><a href="materials.html">MATERIALS</a><a href="index.html#about">ABOUT</a></nav></header><main><div class="bar"><div><span class="eyebrow">PZT-MATERIALS</span><h1>MATERIALS</h1><p>Тексты и фотоколлекции, доступные непосредственно из архива.</p></div><div class="status" id="status">LOADING</div></div><section><div class="section-title"><span>IMAGE COLLECTIONS</span><span id="collectionCount"></span></div><div id="collections" class="grid"></div></section><section style="margin-top:60px"><div class="section-title"><span>TEXT MATERIALS</span><span id="textCount"></span></div><div id="texts" class="text-list"></div></section></main><div id="reader" class="reader" hidden><div class="reader-head"><strong id="readerTitle"></strong><button class="close" id="close">×</button></div><div id="readerBody"></div></div><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=null,base=null;async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(url);return r.json()}async function load(){try{index=await get('material-index.json');base=await get('materials.json');$('#status').textContent='LOCAL INDEX / '+index.collectionCount+' COLLECTIONS';render(index.collections,base.textMaterials)}catch(e){try{base=await get('materials.json');$('#status').textContent='MATERIALS / FALLBACK CATALOG';render(base.imageCollections.map(c=>({id:'legacy-'+c.title,title:c.title,year:null,count:null,images:c.preview?[{name:c.preview.split('/').pop(),path:c.preview}]:[],legacy:true,note:c.note,folder:c.folder})),base.textMaterials)}catch(err){$('#status').textContent='MATERIALS UNAVAILABLE';$('#collections').innerHTML='<p class="empty">Не удалось загрузить каталог материалов.</p>'}}}function render(cols,texts){$('#collectionCount').textContent=cols.length+' COLLECTIONS';$('#textCount').textContent=texts.length+' TEXTS';$('#collections').innerHTML=cols.map(c=>{const first=c.images?.[0]?.path||'';return '<button class="card" data-id="'+esc(c.id)+'"><div class="thumb">'+(first?'<img loading="lazy" src="'+esc(first)+'" alt="">':'')+'</div><div class="meta"><strong>'+esc(c.title)+'</strong><br><span class="count">'+(c.year||'')+(c.count!=null?' · '+c.count+' images':'')+'</span>'+(c.note?'<p class="muted">'+esc(c.note)+'</p>':'')+'</div></button>'}).join('');$('#texts').innerHTML=texts.map((t,i)=>'<button class="text-item" data-text="'+i+'"><span><strong>'+esc(t.title)+'</strong><br><small>'+esc(t.category||'TEXT')+'</small></span><span>OPEN →</span></button>').join('');$('#collections').querySelectorAll('.card').forEach(b=>b.onclick=()=>openCollection(cols.find(c=>c.id===b.dataset.id)));$('#texts').querySelectorAll('.text-item').forEach(b=>b.onclick=()=>openText(texts[Number(b.dataset.text)]))}function openCollection(c){$('#readerTitle').textContent=c.title+(c.count!=null?' / '+c.count+' images':'');let body='';if(c.note)body+='<div class="note">'+esc(c.note)+'</div>';if(c.legacy)body+='<div class="note">Полный список файлов этой коллекции будет добавлен автоматически из material-index.json. Предпросмотр уже доступен.</div>';body+='<div class="collection-grid">'+(c.images||[]).map(i=>'<img loading="lazy" src="'+esc(i.path)+'" alt="'+esc(i.name)+'" title="'+esc(i.name)+'">').join('')+'</div>';$('#readerBody').innerHTML=body;$('#reader').hidden=false;document.body.style.overflow='hidden'}async function openText(t){$('#readerTitle').textContent=t.title;$('#readerBody').innerHTML='<div class="reader-text">LOADING…</div>';$('#reader').hidden=false;document.body.style.overflow='hidden';try{const raw=await fetch(t.path,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()});$('#readerBody').innerHTML='<article class="reader-text">'+markdown(raw)+'</article>'}catch(e){$('#readerBody').innerHTML='<div class="reader-text">Не удалось открыть текст: '+esc(t.path)+'</div>'}}function markdown(s){return esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>').replace(/^(.*)$/gm,'$1').replace(/\n/g,'<br>')}$('#close').onclick=()=>{$('#reader').hidden=true;document.body.style.overflow=''};load();</script></body></html>
