<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARAZIT / MATERIALS</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1400px;margin:auto;padding:40px 24px}.bar{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{border:1px solid currentColor;background:transparent;cursor:pointer;text-align:left;padding:0}.thumb{aspect-ratio:4/3;background:#eee;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.meta{padding:14px}.count{opacity:.65}.reader{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:24px}.reader-head{display:flex;justify-content:space-between;position:sticky;top:0;background:#fff;padding-bottom:16px}.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.collection-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}.close{font-size:28px;border:0;background:none;cursor:pointer}.status{opacity:.65}</style></head><body><header class="masthead"><a class="brand" href="index.html">PARAZIT</a><nav class="primary-nav"><a href="index.html#archive">ARCHIVE</a><a href="index.html#gallery">GALLERY</a><a href="index.html#index">INDEX</a><a href="materials.html">MATERIALS</a><a href="index.html#about">ABOUT</a></nav></header><main><div class="bar"><div><span class="eyebrow">PZT-MATERIALS</span><h1>MATERIALS</h1><p>Тексты и фотоколлекции, доступные непосредственно из архива.</p></div><div class="status" id="status">INDEXING…</div></div><section><div class="section-title"><span>IMAGE COLLECTIONS</span><span id="collectionCount"></span></div><div id="collections" class="grid"></div></section></main><div id="reader" class="reader" hidden><div class="reader-head"><strong id="readerTitle"></strong><button class="close" id="close">×</button></div><div id="readerBody"></div></div><script>const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=null;async function load(){try{index=await fetch('material-index.json',{cache:'no-store'}).then(r=>r.json());$('#status').textContent='LOCAL INDEX / '+index.collectionCount+' COLLECTIONS';$('#collectionCount').textContent=index.collectionCount+' FOLDERS';render()}catch(e){$('#status').textContent='MATERIAL INDEX NOT BUILT YET';$('#collections').innerHTML='<p>Индекс материалов будет создан автоматически при обновлении архива.</p>'}}function render(){const root=$('#collections');root.innerHTML=index.collections.map(c=>{const first=c.images?.[0]?.path||'';return '<button class="card" data-id="'+esc(c.id)+'"><div class="thumb">'+(first?'<img loading="lazy" src="'+esc(first)+'" alt="">':'')+'</div><div class="meta"><strong>'+esc(c.title)+'</strong><br><span class="count">'+(c.year||'')+' · '+c.count+' images</span></div></button>'}).join('');root.querySelectorAll('.card').forEach(b=>b.onclick=()=>openCollection(index.collections.find(c=>c.id===b.dataset.id)))}function openCollection(c){$('#readerTitle').textContent=c.title+' / '+c.count+' images';$('#readerBody').innerHTML='<div class="collection-grid">'+c.images.map(i=>'<img loading="lazy" src="'+esc(i.path)+'" alt="'+esc(i.name)+'" title="'+esc(i.name)+'">').join('')+'</div>';$('#reader').hidden=false;document.body.style.overflow='hidden'}$('#close').onclick=()=>{$('#reader').hidden=true;document.body.style.overflow=''};load();</script></body></html>
